# Weed-YOLOv12 🚀, AGPL-3.0 license
# YOLOv12 + P2 head / no P5 head + LDConv: detection at P2-P4
# Ablation tags: [P234 + LD] -> components 1 + 3

# Parameters
nc: 80 # number of classes (overridden by the dataset yaml)
scales: # model compound scaling constants, i.e. 'model=yolov12n-LD-P234.yaml' will call yolov12-LD-P234.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12-turbo backbone, stride-2 Conv -> LDConv
backbone:
  # [from, repeats, module, args]       LDConv args: [c2, num_param, stride]
  - [-1, 1, LDConv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, LDConv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 (early P2 feature)
  - [-1, 1, LDConv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, LDConv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 6
  - [-1, 1, LDConv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

# head
head:
  # top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 6], 1, Concat, [1]] # 10 cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 4], 1, Concat, [1]] # 13 cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 2], 1, Concat, [1]] # 16 cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 17 (P2/4-xsmall) C3k2 instead of A2C2f on the 160x160 map

  # bottom-up (P5 stage removed)
  - [-1, 1, LDConv, [128, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # 19 cat head P3
  - [-1, 2, A2C2f, [256, False, -1]] # 20 (P3/8-small)

  - [-1, 1, LDConv, [256, 3, 2]] # 21
  - [[-1, 11], 1, Concat, [1]] # 22 cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 23 (P4/16-medium)

  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P2, P3, P4)
